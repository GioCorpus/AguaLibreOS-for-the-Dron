name: agualibreos-api
version: 0.1.0
description: Ground Station Backend API for AguaLibreOS drone fleet management
repository: "https://github.com/gacb/AguaLibreOS-for-the-Dron"
license: "GPL-3.0"

[build-dependencies]
setuptools-rust = { version = "1.8", optional = true }

[dependencies]
mavlink = "0.9"
pydantic = "2.9"
fastapi = "0.111"
uvicorn = { version = "0.30", extras = ["standard"] }
sqlalchemy = "2.0"
websockets = "12.0"
numpy = "1.26"
qiskit = { version = "1.0", optional = true }
celery = { version = "5.4", optional = true }
redis = { version = "5.0", optional = true }
python-dotenv = "1.0"
pydantic-settings = "2.3"
httpx = "0.27"
